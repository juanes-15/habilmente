name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Lunes 06:17 UTC: detecta reglas nuevas aunque no haya cambios.

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analizar:
    name: Analizar (${{ matrix.lenguaje }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Para publicar los hallazgos en la pestaña Security.
    strategy:
      fail-fast: false
      matrix:
        lenguaje: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.lenguaje }}
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
