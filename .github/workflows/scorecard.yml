name: OpenSSF Scorecard

# Evalúa las prácticas de seguridad del repositorio (ramas protegidas, acciones
# fijadas, permisos mínimos, etc.) y publica el resultado para el badge del README.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  branch_protection_rule:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analizar:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Para revisar la configuración de los workflows.
      security-events: write # Para publicar los hallazgos en la pestaña Security.
      id-token: write # Para publicar el resultado en la API pública de Scorecard.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: resultados.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: resultados.sarif
