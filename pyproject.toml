[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "habilmente"
version = "0.1.0.dev0"
description = "Festivos de Colombia y cálculo de días hábiles con calendarios laborales configurables."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juan Roncancio" }]
keywords = ["colombia", "festivos", "dias habiles", "ley emiliani", "calendario laboral", "holidays"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.100",
    # Solo para pruebas: implementaciones independientes con las que se contrasta el cálculo.
    "holidays>=0.100",
    "python-dateutil>=2.9",
    "types-python-dateutil",
]

[project.urls]
Repository = "https://github.com/juanes-15/habilmente"
Issues = "https://github.com/juanes-15/habilmente/issues"
Changelog = "https://github.com/juanes-15/habilmente/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/habilmente"]

[tool.hatch.build.targets.sdist]
include = ["src/habilmente", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle y pyflakes
    "I",             # orden de imports
    "N",             # nombres
    "UP",            # sintaxis moderna
    "B",             # errores probables
    "SIM",           # simplificaciones
    "C4",            # comprensiones
    "D",             # docstrings
    "ANN",           # anotaciones de tipo
    "S",             # seguridad (bandit)
    "PT",            # buenas prácticas de pytest
    "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]  # Permite tildes y "ñ" en textos y comentarios.

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--doctest-modules",
    "--import-mode=importlib",
]
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["habilmente"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
